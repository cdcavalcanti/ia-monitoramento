# ia-monitoramento-infinity
#
# Uma réplica basta: o job diário é idempotente por data (sobrescreve o
# relatório do dia). Sem Redis — não há buffer de mensagens.
services:
  app:
    build: .
    image: ia-monitoramento:latest
    container_name: ia-monitoramento
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-8010}:8000"
    volumes:
      - monitoramento_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx,sys; sys.exit(0 if httpx.get('http://127.0.0.1:8000/health').status_code==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Exposição via Cloudflare Tunnel (padrão da casa). Só sobe com
  # `--profile tunnel` e TUNNEL_TOKEN no .env — sem token, o serviço
  # fica acessível apenas em 127.0.0.1:${APP_HOST_PORT} na VPS.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: ia-monitoramento-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    profiles: ["tunnel"]
    depends_on:
      - app

volumes:
  monitoramento_data:

# Subnet declarada: os address pools do dockerd na VPS co-tenant estão
# esgotados — sem isso o `docker compose up` falha ao criar a rede.
networks:
  default:
    ipam:
      config:
        - subnet: 172.16.48.0/24
